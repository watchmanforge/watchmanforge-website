<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 188 188" role="img" aria-label="Watchman Forge">
  <defs>
    <!-- Brushed-steel gradient: diagonal streaks, dark gunmetal to bright silver and back -->
    <linearGradient id="brushedSilver" x1="20%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"  stop-color="#3a3f45"/>
      <stop offset="18%" stop-color="#8b939b"/>
      <stop offset="32%" stop-color="#e8edf0"/>
      <stop offset="46%" stop-color="#6a727a"/>
      <stop offset="60%" stop-color="#c7cdd2"/>
      <stop offset="75%" stop-color="#4a4f55"/>
      <stop offset="90%" stop-color="#9aa1a8"/>
      <stop offset="100%" stop-color="#2b2f33"/>
    </linearGradient>

    <!-- Slightly darker/duller variant for the ring, so the cross reads as the focal metal -->
    <linearGradient id="brushedSilverRing" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%"  stop-color="#2b2f33"/>
      <stop offset="25%" stop-color="#6a727a"/>
      <stop offset="50%" stop-color="#9aa1a8"/>
      <stop offset="75%" stop-color="#565b61"/>
      <stop offset="100%" stop-color="#1f2226"/>
    </linearGradient>

    <!-- Engraved depth: soft dark drop shadow beneath the cross, offset down-right -->
    <filter id="engrave" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1.4" dy="1.8" stdDeviation="1.1" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Subtle cold vignette on the black field -->
    <radialGradient id="fieldVignette" cx="50%" cy="42%" r="65%">
      <stop offset="0%"  stop-color="#0d0f11"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Black background field -->
  <circle cx="94" cy="94" r="94" fill="url(#fieldVignette)"/>

  <!-- Outer ring, brushed metal -->
  <circle cx="94" cy="94" r="92" fill="none" stroke="url(#brushedSilverRing)" stroke-width="4"/>

